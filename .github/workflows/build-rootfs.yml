name: Build offline foul-play + pokemon-showdown rootfs for iSH-AOK

on:
  # Rebuild every day. Since Alpine's own version is now pinned (see
  # alpine_version below), this no longer pulls in new Alpine OS releases
  # by itself -- it re-fetches fresh packages from the pinned branch's apk
  # repo (rust/cargo/etc. still get their normal point updates) and rebuilds
  # against whatever foul-play/pokemon-showdown/pokemon-showdown-client
  # currently are on their respective *_REF. Scheduled runs have no
  # workflow inputs, so they always use the default runner
  # (ubuntu-24.04-arm, 4 vCPU on a public repo, 2 vCPU on a private one) --
  # for 4 vCPU on a private repo too, trigger via workflow_dispatch with a
  # blacksmith-*-arm runner instead, or edit the fallback below.
  schedule:
    - cron: "17 6 * * *"

  # Manual "build me an update" button, with a couple of knobs.
  workflow_dispatch:
    inputs:
      alpine_version:
        description: >
          Full Alpine version to build against, e.g. 3.23.3. Must be an
          actual released version (dl-cdn.alpinelinux.org/alpine/v<major.minor>/
          releases/<arch>/) -- this is not validated ahead of the download.
        type: string
        default: "3.23.3"
      poke_engine_gen:
        description: >
          poke-engine generation feature for the venv's OWN default
          install only -- every generation (gen1-gen9) plus Champions is
          always built as its own variant regardless of this input, and
          start-showdown/foul-play picks the right one per-battle from
          --pokemon-format (see README "Old-gen and Champions battles").
          This only changes: (1) what an unparseable --pokemon-format
          falls back to, and (2) what a direct `venv/bin/python3 run.py`
          invocation that bypasses the /usr/local/bin/foul-play wrapper
          gets. "default" keeps whatever foul-play's requirements.txt
          already pins (currently gen9 / terastallization).
        type: choice
        default: default
        options:
          - default
          - gen1
          - gen2
          - gen3
          - gen4
          - gen5
          - gen6
          - gen7
          - gen8
          - gen9
      foul_play_ref:
        description: "foul-play git ref (branch, tag, or commit) to build"
        type: string
        default: main
      showdown_ref:
        description: "smogon/pokemon-showdown git ref to build"
        type: string
        default: master
      client_ref:
        description: "smogon/pokemon-showdown-client git ref to build"
        type: string
        default: master
      warm_formats:
        description: >
          Space-separated list of formats to pre-fetch usage-stats/
          team-dataset caches for (see scripts/chroot/36-warm-datasets.sh
          and multiformat/warm_datasets.py), or "auto" for every format
          this build's own bundled Showdown server can directly be
          challenged into that foul-play's engine can actually play --
          singles, laddered, challengeable, gen1-9 (see
          multiformat/list_compatible_formats.py). "auto" is a big,
          best-effort sweep (~260 formats as of writing): individual
          formats with nothing published to fetch (draft leagues,
          customgame sandboxes, one-off community rotations) are skipped,
          not build-failing, and the full pass/fail breakdown is always in
          the release's BUILD_INFO.txt either way. A hand-picked list here
          instead is treated as exhaustive -- any failure in it fails the
          build (WARM_STRICT; see 36-warm-datasets.sh).
        type: string
        default: auto
      runner:
        description: >
          Runner label. ubuntu-24.04-arm/ubuntu-22.04-arm are GitHub's own
          native aarch64 hosted runners -- free on both public repos (4
          vCPU) and private repos (2 vCPU). Pick a blacksmith-*-arm label
          instead for 4 vCPU on a private repo, or for dedicated capacity
          rather than a shared pool (needs the Blacksmith GitHub App
          installed; see README).
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - blacksmith-4vcpu-ubuntu-2404-arm
          - blacksmith-2vcpu-ubuntu-2404-arm

  # Commits that touch the build itself get built and released
  # automatically -- no need to wait for Monday or click the manual
  # dispatch button. Scoped to build-affecting paths so unrelated commits
  # (README edits, etc.) don't spin up a build.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "patches/**"
      - ".github/workflows/build-rootfs.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-24.04-arm' }}
    # Compiling the showdown server's TypeScript, running a full client
    # build (which itself clones+builds a second throwaway server copy),
    # and mirroring ~6000 small sprite/icon files adds real time over the
    # foul-play-only build this started as -- budget generously.
    timeout-minutes: 120
    env:
      ARCH: aarch64
      ALPINE_VERSION: ${{ github.event.inputs.alpine_version || '3.23.3' }}
      # Raw input passed through as-is (may be "default", a gen name, or
      # unset on schedule/push runs); build-rootfs.sh normalizes "default"
      # (and unset) to "" itself, since that's easier to get right in shell
      # than in Actions' expression syntax.
      POKE_ENGINE_GEN: ${{ github.event.inputs.poke_engine_gen }}
      FOUL_PLAY_REF: ${{ github.event.inputs.foul_play_ref || 'main' }}
      SHOWDOWN_REF: ${{ github.event.inputs.showdown_ref || 'master' }}
      CLIENT_REF: ${{ github.event.inputs.client_ref || 'master' }}
      WARM_FORMATS: ${{ github.event.inputs.warm_formats || 'auto' }}
    steps:
      - uses: actions/checkout@v4

      # Caches cargo's compiled build-artifact output (poke-engine's ~30s
      # compile on a real run, not crate *downloads* -- those are already
      # near-instant, see build-rootfs.sh) and npm's package cache. The
      # actual paths involved live inside the chroot's rootfs, which
      # build-rootfs.sh deletes and rebuilds from scratch every run --
      # .ci-cache is a separate, persistent directory it seeds the fresh
      # rootfs from and re-extracts into before packaging, specifically so
      # there's something stable here for actions/cache to follow across
      # runs. See build-rootfs.sh's own comments on CI_CACHE_DIR for why.
      #
      # The primary key always includes run_id, so it never already
      # exists and a save always happens at the end of a successful job;
      # restore-keys does the actual work of finding the closest previous
      # cache to warm-start from.
      - uses: actions/cache@v4
        with:
          path: .ci-cache
          key: ci-cache-${{ runner.os }}-${{ github.event.inputs.poke_engine_gen || 'default' }}-${{ github.event.inputs.foul_play_ref || 'main' }}-${{ github.event.inputs.showdown_ref || 'master' }}-${{ github.event.inputs.client_ref || 'master' }}-${{ github.run_id }}
          restore-keys: |
            ci-cache-${{ runner.os }}-${{ github.event.inputs.poke_engine_gen || 'default' }}-${{ github.event.inputs.foul_play_ref || 'main' }}-${{ github.event.inputs.showdown_ref || 'master' }}-${{ github.event.inputs.client_ref || 'master' }}-
            ci-cache-${{ runner.os }}-

      - name: Build the rootfs
        run: sudo -E ./scripts/build-rootfs.sh

      - name: Show artifact
        run: |
          ls -lh out/
          cat out/BUILD_INFO.txt

      - name: Compute build timestamp
        id: ts
        run: |
          # "tag" is the unique, tag-safe identifier (real timestamp down to
          # the second, plus the short commit sha) that makes *this* run's
          # release genuinely its own release instead of colliding with any
          # other run's. "display" is just the human-readable form used in
          # the release title/body.
          echo "tag=$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "display=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact (debugging / non-release runs)
        uses: actions/upload-artifact@v4
        with:
          name: foul-play-showdown-offline-rootfs
          path: out/*
          retention-days: 14

      - name: Publish dated release
        uses: softprops/action-gh-release@v2
        with:
          # Every run gets its own tag (real UTC timestamp, to the second,
          # plus the short commit sha), so every build becomes its own,
          # permanent release -- nothing here ever gets edited or piled
          # onto a shared release page. softprops/action-gh-release
          # creates a new release whenever the tag doesn't already exist
          # yet, which a tag this specific never will.
          #
          # Only the dated (alpine-version-and-timestamp-named) tarball
          # goes on this release, never the constant-named "latest" one --
          # that one belongs solely to the rootfs-latest release below.
          # Keeping them apart means every dated release keeps exactly the
          # one tarball URL it was built with, forever, instead of also
          # carrying a same-named "-latest" asset that stops being true
          # the moment the next run publishes.
          tag_name: "rootfs-${{ steps.ts.outputs.tag }}"
          name: "foul-play + offline pokemon-showdown rootfs for iSH-AOK (built ${{ steps.ts.outputs.display }})"
          body_path: out/BUILD_INFO.txt
          # This release is a historical snapshot, not the one GitHub's
          # "latest release" pointer should follow -- that's rootfs-latest,
          # published in the next step.
          make_latest: false
          files: |
            out/*-alpine*.tar.gz
            out/*-alpine*.tar.gz.sha256
            out/BUILD_INFO.txt

      - name: Publish rootfs-latest release
        uses: softprops/action-gh-release@v2
        with:
          # Fixed tag, reused every run: softprops/action-gh-release
          # updates the existing rootfs-latest release in place (replacing
          # its assets, since overwrite_files defaults to true) instead of
          # creating a new one, so this stays a single release with a
          # single, never-changing download URL:
          #   https://github.com/<owner>/<repo>/releases/download/rootfs-latest/foul-play-showdown-offline-aarch64-latest.tar.gz
          # (also see the README's "Get the rootfs" section, which links
          # straight to this tag). make_latest: true additionally makes
          # this the release GitHub's own "Latest" badge and
          # /releases/latest/ pointer follow.
          tag_name: rootfs-latest
          name: "foul-play + offline pokemon-showdown rootfs for iSH-AOK (latest build)"
          body_path: out/BUILD_INFO.txt
          make_latest: true
          files: |
            out/*-latest.tar.gz
            out/*-latest.tar.gz.sha256
            out/BUILD_INFO.txt
